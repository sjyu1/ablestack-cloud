name: Rocky 9.7 RPM Packaging

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Package variant
        required: false
        default: oss
        type: choice
        options:
          - oss
          - noredist
      simulator:
        description: Include simulator packaging
        required: false
        default: default
        type: choice
        options:
          - default
          - simulator
      release:
        description: Optional package release override
        required: false
        default: ''
        type: string
      templates:
        description: Optional template list (for example kvm,xen,vmware)
        required: false
        default: ''
        type: string
      node_version:
        description: Node.js version injected into the Rocky build container
        required: false
        default: 14.21.3
        type: string
  pull_request:
    paths:
      - '.github/workflows/rocky97-rpm.yml'
      - 'packaging/**'
      - 'tools/build/rocky97-rpm-build.sh'
      - 'ui/**'
      - 'pom.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rpm-rocky97:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      ROCKY97_URL: https://download.rockylinux.org/pub/rocky/9.7/images/x86_64/Rocky-9-Container-Base.latest.x86_64.tar.xz
      ROCKY97_SHA256: 2213bb44c0f1bfd0bbef16118ab5a1ec6875362c5ad6c6dafdecf28d14151ad2
      BUILD_PACK: ${{ github.event.inputs.pack || 'oss' }}
      BUILD_SIMULATOR: ${{ github.event.inputs.simulator || 'default' }}
      BUILD_RELEASE: ${{ github.event.inputs.release || '' }}
      BUILD_TEMPLATES: ${{ github.event.inputs.templates || '' }}
      BUILD_NODE_VERSION: ${{ github.event.inputs.node_version || '14.21.3' }}

    steps:
      - uses: actions/checkout@v6

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils

      - name: Download Rocky 9.7 container archive
        run: |
          curl -fsSL -o /tmp/rocky97.tar.xz "$ROCKY97_URL"
          echo "$ROCKY97_SHA256  /tmp/rocky97.tar.xz" | sha256sum -c -

      - name: Load Rocky 9.7 image into Docker
        run: |
          load_output=$(xz -dc /tmp/rocky97.tar.xz | docker load)
          echo "$load_output"
          image_ref=$(printf '%s\n' "$load_output" | awk -F': ' '/Loaded image: / {print $2; exit}')
          if [ -z "$image_ref" ]; then
            image_ref=$(printf '%s\n' "$load_output" | awk -F': ' '/Loaded image ID: / {print $2; exit}')
          fi
          if [ -z "$image_ref" ]; then
            echo "Failed to determine loaded image reference"
            exit 1
          fi
          docker tag "$image_ref" ablestack/rocky97-build:latest
          docker image inspect ablestack/rocky97-build:latest >/dev/null

      - name: Build RPM packages inside Rocky 9.7
        run: |
          mkdir -p dist/rocky97-build
          set -o pipefail
          docker run --rm \
            --workdir /workspace \
            -e PACK="$BUILD_PACK" \
            -e SIMULATOR="$BUILD_SIMULATOR" \
            -e RELEASE="$BUILD_RELEASE" \
            -e TEMPLATES="$BUILD_TEMPLATES" \
            -e DISTRO="rocky9" \
            -e NODE_VERSION="$BUILD_NODE_VERSION" \
            -v "$GITHUB_WORKSPACE":/workspace \
            ablestack/rocky97-build:latest \
            bash -lc './tools/build/rocky97-rpm-build.sh' | tee dist/rocky97-build/build.log

      - name: Summarize RPM artifacts
        run: |
          {
            echo "## Rocky 9.7 RPM Packaging"
            echo
            echo "- Pack: \`$BUILD_PACK\`"
            echo "- Simulator: \`$BUILD_SIMULATOR\`"
            echo "- Release: \`${BUILD_RELEASE:-default}\`"
            echo "- Templates: \`${BUILD_TEMPLATES:-none}\`"
            echo "- Node.js: \`$BUILD_NODE_VERSION\`"
            echo
            echo "### Artifacts"
            if [ -f dist/rocky97-build/artifacts.txt ]; then
              while IFS= read -r artifact; do
                echo "- \`$artifact\`"
              done < dist/rocky97-build/artifacts.txt
            else
              echo "- No artifact manifest was generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rocky 9.7 build outputs
        uses: actions/upload-artifact@v4
        with:
          name: rocky97-rpm-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/rocky97-build/**
            dist/rpmbuild/RPMS/**/*.rpm
            dist/rpmbuild/SRPMS/**/*.rpm
