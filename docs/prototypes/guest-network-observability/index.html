<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABLESTACK 게스트 네트워크 UI 프로토타입</title>
  <link rel="stylesheet" href="../../../ui/node_modules/ant-design-vue/dist/antd.min.css">
  <style>
    :root {
      --primary: #1890ff;
      --layout-bg: #f0f2f5;
      --border: #d9d9d9;
      --heading: rgba(0, 0, 0, 0.85);
      --text: rgba(0, 0, 0, 0.65);
      --secondary: rgba(0, 0, 0, 0.45);
      --success: #52c41a;
      --warning: #faad14;
      --error: #f5222d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #app {
      margin: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      background: var(--layout-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
        "Helvetica Neue", Arial, sans-serif;
    }

    [v-cloak] {
      display: none;
    }

    .app-layout {
      min-height: 100vh;
    }

    .app-sider {
      background: #fff !important;
      border-right: 1px solid #eee;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
      height: 100vh;
      left: 0;
      overflow: hidden;
      position: fixed;
      top: 0;
      z-index: 20;
    }

    .app-logo {
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      height: 64px;
      justify-content: center;
      overflow: hidden;
      padding: 7px 10px;
    }

    .app-logo img {
      height: auto;
      max-width: 230px;
      width: 100%;
    }

    .side-scroll {
      height: calc(100vh - 64px);
      overflow-y: auto;
      padding-bottom: 28px;
    }

    .side-menu {
      border-right: 0 !important;
    }

    .side-menu .ant-menu-item,
    .side-menu .ant-menu-submenu-title {
      height: 44px;
      line-height: 44px;
      margin: 0 !important;
      width: 100%;
    }

    .side-menu .ant-menu-item-selected {
      background: #e6f7ff !important;
      border-right: 3px solid var(--primary);
    }

    .menu-glyph {
      color: #777;
      display: inline-block;
      font-size: 16px;
      margin-right: 10px;
      text-align: center;
      width: 18px;
    }

    .app-main {
      margin-left: 256px;
      min-width: 980px;
    }

    .app-header {
      align-items: center;
      background: #fff !important;
      box-shadow: 0 1px 4px rgba(0, 21, 41, 0.08);
      display: flex;
      height: 64px;
      justify-content: space-between;
      line-height: normal;
      padding: 0 26px 0 20px;
      position: sticky;
      top: 0;
      z-index: 15;
    }

    .header-left,
    .header-right,
    .toolbar-left,
    .toolbar-right,
    .inline-row {
      align-items: center;
      display: flex;
    }

    .header-left {
      gap: 18px;
    }

    .header-right {
      gap: 18px;
    }

    .header-trigger {
      color: #555;
      font-size: 20px;
    }

    .header-view-select {
      width: 450px;
    }

    .header-icon {
      color: #555;
      font-size: 18px;
    }

    .header-user {
      color: #555;
      gap: 9px;
    }

    .page-content {
      background: var(--layout-bg);
      min-height: calc(100vh - 64px);
      padding: 12px;
    }

    .toolbar-card {
      border: 0;
      border-radius: 0;
      margin-bottom: 12px;
    }

    .toolbar-card > .ant-card-body {
      padding: 14px 16px;
    }

    .toolbar {
      align-items: center;
      display: flex;
      justify-content: space-between;
    }

    .toolbar-left,
    .toolbar-right {
      gap: 10px;
    }

    .toolbar-search {
      width: 500px;
    }

    .prototype-note {
      color: var(--secondary);
      font-size: 12px;
      margin-left: 8px;
    }

    .list-card {
      border: 0;
      border-radius: 0;
    }

    .list-card > .ant-card-body {
      padding: 0;
    }

    .vm-table .ant-table-thead > tr > th {
      background: #fafafa;
      color: rgba(0, 0, 0, 0.7);
      font-size: 13px;
      font-weight: 600;
      padding: 12px 10px;
      white-space: nowrap;
    }

    .vm-table .ant-table-tbody > tr > td {
      padding: 11px 10px;
      vertical-align: middle;
    }

    .vm-name {
      align-items: center;
      display: flex;
      gap: 10px;
    }

    .os-mark {
      align-items: center;
      color: #777;
      display: inline-flex;
      font-size: 23px;
      height: 28px;
      justify-content: center;
      width: 28px;
    }

    .state-dot {
      border-radius: 50%;
      display: inline-block;
      height: 10px;
      margin-right: 7px;
      width: 10px;
    }

    .state-dot.running {
      background: var(--success);
    }

    .state-dot.stopped {
      background: var(--error);
    }

    .agent-tag {
      margin: 0;
    }

    .ip-summary {
      min-width: 360px;
    }

    .ip-line {
      align-items: flex-start;
      display: flex;
      gap: 8px;
      line-height: 22px;
      margin-bottom: 4px;
    }

    .ip-line:last-child {
      margin-bottom: 0;
    }

    .ip-label {
      color: var(--secondary);
      flex: 0 0 44px;
      font-size: 12px;
      font-weight: 600;
    }

    .ip-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .ip-tags .ant-tag {
      margin: 0;
      padding: 0 6px;
    }

    .guest-health {
      font-size: 11px;
      margin-left: 3px !important;
    }

    .pagination-row {
      align-items: center;
      display: flex;
      justify-content: flex-end;
      padding: 12px 16px;
    }

    .detail-grid {
      align-items: flex-start;
    }

    .info-card,
    .detail-card {
      border-radius: 2px;
    }

    .info-card > .ant-card-body {
      padding: 30px;
    }

    .resource-title {
      align-items: center;
      display: flex;
      gap: 18px;
      margin-bottom: 18px;
    }

    .resource-avatar {
      align-items: center;
      border: 2px solid #8c8c8c;
      border-radius: 50%;
      color: #777;
      display: flex;
      font-size: 34px;
      height: 54px;
      justify-content: center;
      width: 54px;
    }

    .resource-name {
      color: var(--heading);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 9px;
      word-break: break-all;
    }

    .resource-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .resource-tags .ant-tag {
      margin: 0;
    }

    .info-item {
      margin-bottom: 19px;
    }

    .info-label {
      color: var(--heading);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .info-value {
      align-items: flex-start;
      display: flex;
      gap: 9px;
      line-height: 22px;
      word-break: break-all;
    }

    .info-icon {
      color: #888;
      flex: 0 0 16px;
      text-align: center;
    }

    .detail-card > .ant-card-body {
      min-height: 760px;
      padding: 28px 26px;
    }

    .detail-tabs > .ant-tabs-nav {
      min-width: 118px;
    }

    .detail-tabs > .ant-tabs-content-holder {
      padding-left: 24px;
    }

    .detail-tabs .ant-tabs-tab {
      padding: 11px 18px 11px 0;
    }

    .guest-panel {
      min-width: 0;
    }

    .guest-panel .ant-alert {
      margin-bottom: 16px;
      white-space: normal;
    }

    .collection-summary {
      margin-bottom: 18px;
    }

    .collection-summary .ant-descriptions-item-label {
      font-weight: 600;
      white-space: nowrap;
    }

    .section-block {
      margin-top: 22px;
    }

    .section-heading {
      align-items: center;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      color: var(--heading);
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .section-subtitle {
      color: var(--secondary);
      font-size: 12px;
      margin-top: 2px;
    }

    .interface-table .ant-table-thead > tr > th,
    .route-table .ant-table-thead > tr > th {
      background: #fafafa;
      padding: 9px 8px;
      white-space: nowrap;
    }

    .interface-table .ant-table-tbody > tr > td,
    .route-table .ant-table-tbody > tr > td {
      padding: 9px 8px;
      vertical-align: top;
    }

    .interface-name {
      color: var(--heading);
      font-weight: 600;
    }

    .interface-meta {
      color: var(--secondary);
      font-size: 11px;
      margin-top: 3px;
    }

    .address-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 410px;
    }

    .address-stack .ant-tag {
      margin: 0;
    }

    .address-scope {
      color: var(--secondary);
      font-size: 10px;
      margin-left: 4px;
    }

    .dns-card {
      border-radius: 2px;
    }

    .dns-card > .ant-card-head {
      min-height: 42px;
    }

    .dns-card > .ant-card-head .ant-card-head-title {
      padding: 10px 0;
    }

    .dns-card > .ant-card-body {
      padding: 14px 16px 8px;
    }

    .dns-card .ant-descriptions-item-label {
      color: var(--secondary);
      width: 125px;
    }

    .route-filters {
      display: flex;
      gap: 6px;
    }

    .default-route {
      color: var(--primary);
      font-size: 11px;
      font-weight: 600;
      margin-left: 5px;
    }

    .muted {
      color: var(--secondary);
    }

    @media (max-width: 1180px) {
      .app-sider {
        width: 220px !important;
      }

      .app-main {
        margin-left: 220px;
      }

      .header-view-select {
        width: 300px;
      }

      .toolbar-search {
        width: 320px;
      }
    }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <a-layout class="app-layout">
      <a-layout-sider class="app-sider" width="256" theme="light">
        <div class="app-logo">
          <img src="../../../ui/public/assets/logo-ablestack.png" alt="ABLESTACK">
        </div>
        <div class="side-scroll">
          <a-menu
            class="side-menu"
            mode="inline"
            :selected-keys="['vm']"
            :open-keys="['compute']">
            <a-menu-item key="dashboard">
              <span class="menu-glyph">◴</span>
              <span>대시보드</span>
            </a-menu-item>
            <a-sub-menu key="compute">
              <template #title>
                <span class="menu-glyph">☁</span>
                <span>컴퓨트</span>
              </template>
              <a-menu-item key="vm" @click="openList">
                <span class="menu-glyph">▣</span>
                <span>가상머신</span>
              </a-menu-item>
              <a-menu-item key="vmsnapshot">
                <span class="menu-glyph">▧</span>
                <span>VM 스냅샷</span>
              </a-menu-item>
              <a-menu-item key="kubernetes">
                <span class="menu-glyph">◉</span>
                <span>쿠버네티스</span>
              </a-menu-item>
              <a-menu-item key="autoscale">
                <span class="menu-glyph">⌗</span>
                <span>오토스케일 VM 그룹</span>
              </a-menu-item>
              <a-menu-item key="vmgroup">
                <span class="menu-glyph">⌘</span>
                <span>가상머신 그룹</span>
              </a-menu-item>
              <a-menu-item key="ssh">
                <span class="menu-glyph">⚿</span>
                <span>SSH 키 쌍</span>
              </a-menu-item>
              <a-menu-item key="userdata">
                <span class="menu-glyph">▤</span>
                <span>사용자 데이터 라이브러리</span>
              </a-menu-item>
              <a-menu-item key="affinity">
                <span class="menu-glyph">⇄</span>
                <span>Affinity 그룹</span>
              </a-menu-item>
            </a-sub-menu>
            <a-sub-menu key="storage">
              <template #title>
                <span class="menu-glyph">▥</span>
                <span>스토리지</span>
              </template>
              <a-menu-item key="volumes">볼륨</a-menu-item>
              <a-menu-item key="snapshots">스냅샷</a-menu-item>
              <a-menu-item key="sharedfs">공유 파일 시스템</a-menu-item>
            </a-sub-menu>
            <a-sub-menu key="network">
              <template #title>
                <span class="menu-glyph">⌁</span>
                <span>네트워크</span>
              </template>
              <a-menu-item key="guestnetwork">게스트 네트워크</a-menu-item>
              <a-menu-item key="publicip">공인 IP 주소</a-menu-item>
            </a-sub-menu>
            <a-sub-menu key="image">
              <template #title>
                <span class="menu-glyph">▧</span>
                <span>이미지</span>
              </template>
              <a-menu-item key="template">템플릿</a-menu-item>
              <a-menu-item key="iso">ISO</a-menu-item>
            </a-sub-menu>
            <a-menu-item key="event">
              <span class="menu-glyph">▣</span>
              <span>이벤트</span>
            </a-menu-item>
            <a-menu-item key="project">
              <span class="menu-glyph">▤</span>
              <span>프로젝트</span>
            </a-menu-item>
            <a-menu-item key="account">
              <span class="menu-glyph">♙</span>
              <span>계정</span>
            </a-menu-item>
          </a-menu>
        </div>
      </a-layout-sider>

      <a-layout class="app-main">
        <a-layout-header class="app-header">
          <div class="header-left">
            <span class="header-trigger">☰</span>
            <a-select class="header-view-select" value="기본 보기">
              <a-select-option value="기본 보기">▣ 기본 보기</a-select-option>
            </a-select>
          </div>
          <div class="header-right">
            <a-button type="primary">생성⌄</a-button>
            <span class="header-icon">A⇄</span>
            <span class="header-icon">♧</span>
            <span class="inline-row header-user">
              <a-avatar style="background-color:#1890ff">AC</a-avatar>
              <span>admin cloud</span>
            </span>
          </div>
        </a-layout-header>

        <a-layout-content class="page-content">
          <template v-if="view === 'list'">
            <a-card class="toolbar-card">
              <div class="toolbar">
                <div class="toolbar-left">
                  <a-breadcrumb>
                    <a-breadcrumb-item>⌂</a-breadcrumb-item>
                    <a-breadcrumb-item>가상머신</a-breadcrumb-item>
                  </a-breadcrumb>
                  <a-button shape="round" size="small">↻ 업데이트</a-button>
                  <a-select size="small" value="모두" style="width:95px">
                    <a-select-option value="모두">모두</a-select-option>
                  </a-select>
                  <a-switch checked-children="메트릭" un-checked-children="메트릭"></a-switch>
                  <a-switch checked-children="프로젝트" un-checked-children="프로젝트"></a-switch>
                </div>
                <div class="toolbar-right">
                  <a-button type="primary" shape="round">＋ 가상머신 추가</a-button>
                  <a-button>▽</a-button>
                  <a-input-search
                    class="toolbar-search"
                    placeholder="검색"
                    enter-button>
                  </a-input-search>
                </div>
              </div>
            </a-card>

            <a-card class="list-card">
              <a-table
                class="vm-table"
                size="middle"
                :columns="listColumns"
                :data-source="vms"
                :pagination="false"
                :scroll="{ x: 1580 }"
                row-key="name">
                <template #bodyCell="{ column, record }">
                  <template v-if="column.key === 'select'">
                    <a-checkbox></a-checkbox>
                  </template>
                  <template v-else-if="column.key === 'name'">
                    <div class="vm-name">
                      <span class="os-mark">{{ record.os }}</span>
                      <a href="#" @click.prevent="openDetail(record)">{{ record.name }}</a>
                    </div>
                  </template>
                  <template v-else-if="column.key === 'state'">
                    <span :class="['state-dot', record.running ? 'running' : 'stopped']"></span>
                    {{ record.running ? '실행 중' : '정지된 상태' }}
                  </template>
                  <template v-else-if="column.key === 'agent'">
                    <a-tag
                      class="agent-tag"
                      :color="record.agent === '미설치' ? 'error' : 'success'">
                      {{ record.agent }}
                    </a-tag>
                  </template>
                  <template v-else-if="column.key === 'ip'">
                    <div class="ip-summary">
                      <div class="ip-line">
                        <span class="ip-label">Cloud</span>
                        <a href="javascript:;">{{ record.cloudIp }}</a>
                      </div>
                      <div class="ip-line">
                        <span class="ip-label">Guest</span>
                        <div class="ip-tags">
                          <a-tag
                            v-for="address in record.visibleGuestAddresses"
                            :key="address.value"
                            :color="address.family === 'IPv6' ? 'purple' : 'green'">
                            {{ address.family }} {{ address.value }}
                          </a-tag>
                          <a-button
                            v-if="record.hiddenCount > 0"
                            size="small"
                            @click="record.expanded = !record.expanded">
                            {{ record.expanded ? '접기' : '+' + record.hiddenCount + ' 더보기' }}
                          </a-button>
                          <a-tag
                            class="guest-health"
                            :color="healthColor(record.health)">
                            {{ record.health }}
                          </a-tag>
                        </div>
                      </div>
                    </div>
                  </template>
                  <template v-else-if="column.key === 'host'">
                    <a href="javascript:;" v-if="record.host">{{ record.host }}</a>
                    <span v-else>—</span>
                  </template>
                  <template v-else-if="column.key === 'account'">
                    <a href="javascript:;">{{ record.account }}</a>
                  </template>
                  <template v-else-if="column.key === 'zone'">
                    <a href="javascript:;">{{ record.zone }}</a>
                  </template>
                </template>
              </a-table>
              <div class="pagination-row">
                <a-pagination
                  size="small"
                  :total="33"
                  :page-size="20"
                  :show-total="total => `전체 ${total} 개 항목 중 1-20 표시`"
                  show-size-changer>
                </a-pagination>
              </div>
            </a-card>
          </template>

          <template v-else>
            <a-card class="toolbar-card">
              <div class="toolbar">
                <div class="toolbar-left">
                  <a-breadcrumb>
                    <a-breadcrumb-item><a href="#" @click.prevent="openList">⌂</a></a-breadcrumb-item>
                    <a-breadcrumb-item><a href="#" @click.prevent="openList">가상머신</a></a-breadcrumb-item>
                    <a-breadcrumb-item>erp-app-01</a-breadcrumb-item>
                  </a-breadcrumb>
                  <a-button shape="round" size="small">↻ 업데이트</a-button>
                </div>
                <div class="toolbar-right">
                  <a-button type="primary">⌄ 작업</a-button>
                </div>
              </div>
            </a-card>

            <a-row :gutter="12" class="detail-grid">
              <a-col :span="7">
                <a-card class="info-card">
                  <div class="resource-title">
                    <div class="resource-avatar">◔</div>
                    <div>
                      <div class="resource-name">erp-app-01</div>
                      <div class="resource-tags">
                        <a-tag>i-2-184-VM</a-tag>
                        <a-tag>x86_64</a-tag>
                        <a-tag>KVM</a-tag>
                        <a-tag>HA 활성화</a-tag>
                      </div>
                    </div>
                  </div>

                  <a-divider></a-divider>

                  <div class="info-item">
                    <div class="info-label">상태</div>
                    <div class="info-value">
                      <span class="state-dot running"></span>
                      <span>실행 중</span>
                    </div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">아이디</div>
                    <div class="info-value">
                      <span class="info-icon">▥</span>
                      <a href="javascript:;">51f9e99c-7d4a-40f4-9b87-83f061ec1e10</a>
                    </div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">OS 유형</div>
                    <div class="info-value">
                      <span class="info-icon">◔</span>
                      <a href="javascript:;">Rocky Linux 9 (64-bit)</a>
                    </div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">IP</div>
                    <div class="info-value">
                      <span class="info-icon">⌾</span>
                      <a href="javascript:;">192.168.10.20</a>
                    </div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">CPU</div>
                    <div class="info-value">
                      <span class="info-icon">▦</span>
                      <span>4 CPU x 2.40 GHz</span>

                      </div>
                    </a-tab-pane>

                      <a-empty description="스케줄 탭"></a-empty>

  <script src="../../../ui/node_modules/vue/dist/vue.global.prod.js"></script>
  <script src="../../../ui/node_modules/dayjs/dayjs.min.js"></script>
  <script src="../../../ui/node_modules/dayjs/plugin/advancedFormat.js"></script>
  <script src="../../../ui/node_modules/dayjs/plugin/customParseFormat.js"></script>
  <script src="../../../ui/node_modules/dayjs/plugin/localeData.js"></script>
  <script src="../../../ui/node_modules/dayjs/plugin/quarterOfYear.js"></script>
  <script src="../../../ui/node_modules/dayjs/plugin/weekOfYear.js"></script>
  <script src="../../../ui/node_modules/dayjs/plugin/weekYear.js"></script>
  <script src="../../../ui/node_modules/dayjs/plugin/weekday.js"></script>
  <script src="../../../ui/node_modules/ant-design-vue/dist/antd.min.js"></script>
  <script>
    const { createApp, computed, h, reactive, ref } = Vue;

    createApp({
      setup() {
        const params = new URLSearchParams(window.location.search);
        const view = ref(params.get('view') === 'detail' ? 'detail' : 'list');
        const detailTab = ref('guestnetwork');
        const routeFilter = ref('전체 8');
        const routeFilters = ['전체 8', 'IPv4 5', 'IPv6 3', 'Default 2'];

        const listColumns = [
          {
            title: '',
            key: 'select',
            width: 42,
            fixed: 'left',
            customRender: () => h(antd.Checkbox)
          },
          {
            title: '이름',
            dataIndex: 'name',
            key: 'name',
            width: 240,
            fixed: 'left',
            customRender: ({ record }) => h('div', { class: 'vm-name' }, [
              h('span', { class: 'os-mark' }, record.os),
              h('a', {
                href: '#',
                onClick: event => {
                  event.preventDefault();
                  openDetail(record);
                }
              }, record.name)
            ])
          },
          {
            title: '상태',
            key: 'state',
            width: 115,
            customRender: ({ record }) => h('span', {}, [
              h('span', { class: ['state-dot', record.running ? 'running' : 'stopped'] }),
              record.running ? '실행 중' : '정지된 상태'
            ])
          },
          {
            title: '에이전트 버전',
            key: 'agent',
            width: 115,
            customRender: ({ record }) => h(
              antd.Tag,
              {
                class: 'agent-tag',
                color: record.agent === '미설치' ? 'error' : 'success'
              },
              () => record.agent
            )
          },
          { title: '내부 이름', dataIndex: 'instanceName', key: 'instanceName', width: 120 },
          {
            title: 'IP 주소',
            key: 'ip',
            width: 510,
            customRender: ({ record }) => h('div', { class: 'ip-summary' }, [
              h('div', { class: 'ip-line' }, [
                h('span', { class: 'ip-label' }, 'Cloud'),
                h('a', { href: 'javascript:;' }, record.cloudIp)
              ]),
              h('div', { class: 'ip-line' }, [
                h('span', { class: 'ip-label' }, 'Guest'),
                h('div', { class: 'ip-tags' }, [
                  ...record.visibleGuestAddresses.map(address => h(
                    antd.Tag,
                    {
                      color: address.family === 'IPv6' ? 'purple' : 'green',
                      key: address.value
                    },
                    () => `${address.family} ${address.value}`
                  )),
                  record.hiddenCount > 0
                    ? h(
                        antd.Button,
                        {
                          size: 'small',
                          onClick: () => {
                            record.expanded = !record.expanded;
                          }
                        },
                        () => record.expanded ? '접기' : `+${record.hiddenCount} 더보기`
                      )
                    : null,
                  h(
                    antd.Tag,
                    {
                      class: 'guest-health',
                      color: healthColor(record.health)
                    },
                    () => record.health
                  )
                ])
              ])
            ])
          },
          { title: 'CPU 아키텍처', dataIndex: 'arch', key: 'arch', width: 120 },
          {
            title: '호스트',
            key: 'host',
            width: 135,
            customRender: ({ record }) => record.host
              ? h('a', { href: 'javascript:;' }, record.host)
              : h('span', {}, '—')
          },
          {
            title: '계정',
            key: 'account',
            width: 95,
            customRender: ({ record }) => h('a', { href: 'javascript:;' }, record.account)
          },
          {
            title: 'Zone',
            key: 'zone',
            width: 105,
            customRender: ({ record }) => h('a', { href: 'javascript:;' }, record.zone)
          }
        ];

        const vmSeed = [
          {
            name: 'erp-app-01',
            os: '◔',
            running: true,
            agent: '8.2.0',
            instanceName: 'i-2-184-VM',
            cloudIp: '192.168.10.20',
            guestAddresses: [
              { family: 'IPv4', value: '192.168.10.20/24' },
              { family: 'IPv4', value: '192.168.10.21/24' },
              { family: 'IPv6', value: '2001:db8::20/64' },
              { family: 'IPv6', value: 'fe80::5054:ff:fe12:3456/64' },
              { family: 'IPv4', value: '10.50.0.15/24' }
            ],
            health: '정상 · 18초 전',
            arch: 'x86_64',
            host: 'ablecube22-1',
            account: 'admin',
            zone: 'Zone-22'
          },
          {
            name: 'win-db-02',
            os: '⊞',
            running: true,
            agent: '109.1.0',
            instanceName: 'i-2-190-VM',
            cloudIp: '10.30.5.17',
            guestAddresses: [
              { family: 'IPv4', value: '10.30.5.17/24' },
              { family: 'IPv6', value: '2001:db8:30::17/64' },
              { family: 'IPv6', value: 'fe80::8c2a:13ff:fe77:2a10/64' }
            ],
            health: '부분 수집 · route 미지원',
            arch: 'x86_64',
            host: 'ablecube22-2',
            account: 'admin',
            zone: 'Zone-22'
          },
          {
            name: 'legacy-api-03',
            os: '◔',
            running: true,
            agent: '7.2.22',
            instanceName: 'i-2-193-VM',
            cloudIp: '172.16.44.31',
            guestAddresses: [
              { family: 'IPv4', value: '172.16.44.31/24' }
            ],
            health: '오래됨 · 17분 전',
            arch: 'x86_64',
            host: 'ablecube22-3',
            account: 'admin',
            zone: 'Zone-22'
          },
          {
            name: 'batch-worker-04',
            os: '◔',
            running: false,
            agent: '8.2.0',
            instanceName: 'i-2-201-VM',
            cloudIp: '10.40.2.31',
            guestAddresses: [
              { family: 'IPv4', value: '10.40.2.31/24' }
            ],
            health: '마지막 정상값',
            arch: 'x86_64',
            host: '',
            account: 'admin',
            zone: 'Zone-22'
          },
          {
            name: 'network-test-05',
            os: '◉',
            running: true,
            agent: '미설치',
            instanceName: 'network-test-05',
            cloudIp: '10.10.254.229',
            guestAddresses: [],
            health: '수집 불가',
            arch: 'x86_64',
            host: 'ablecube22-1',
            account: 'admin',
            zone: 'Zone-22'
          }
        ];

        const vms = reactive(vmSeed.map(vm => ({
          ...vm,
          expanded: false,
          get visibleGuestAddresses() {
            return this.expanded ? this.guestAddresses : this.guestAddresses.slice(0, 3);
          },
          get hiddenCount() {
            return this.expanded ? 0 : Math.max(0, this.guestAddresses.length - 3);
          }
        })));

        const interfaceColumns = [
          {
            title: '인터페이스 / Cloud 연결',
            key: 'name',
            width: 205,
            customRender: ({ record }) => h('div', {}, [
              h('div', { class: 'interface-name' }, [
                record.name,
                h(antd.Badge, {
                  style: { marginLeft: '9px' },
                  status: record.state === 'UP' ? 'success' : 'default',
                  text: record.state
                })
              ]),
              h('div', { class: 'interface-meta' }, record.mac),
              record.cloudNic !== null
                ? h('div', { class: 'interface-meta' }, [
                    h('a', { href: 'javascript:;' }, `Cloud NIC ${record.cloudNic}`),
                    ` · ${record.network}`
                  ])
                : h(antd.Tag, { style: { marginTop: '4px' } }, () => 'guest-only')
            ])
          },
          {
            title: 'IP 주소',
            key: 'addresses',
            customRender: ({ record }) => h(
              'div',
              { class: 'address-stack' },
              record.addresses.map(address => h(
                antd.Tag,
                {
                  color: address.family === 'IPv6' ? 'purple' : 'green',
                  key: address.value
                },
                () => [
                  `${address.family} ${address.value}`,
                  h('span', { class: 'address-scope' }, address.scope)
                ]
              ))
            )
          }
        ];

        const interfaces = [
          {
            name: 'eth0',
            mac: '52:54:00:12:34:56',
            state: 'UP',
            cloudNic: 0,
            network: 'L2-Network',
            addresses: [
              { family: 'IPv4', value: '192.168.10.20/24', scope: 'private' },
              { family: 'IPv4', value: '192.168.10.21/24', scope: 'secondary' },
              { family: 'IPv6', value: '2001:db8::20/64', scope: 'global' },
              { family: 'IPv6', value: 'fe80::5054:ff:fe12:3456/64', scope: 'link-local' }
            ]
          },
          {
            name: 'eth1',
            mac: '52:54:00:aa:bb:cc',
            state: 'UP',
            cloudNic: 1,
            network: 'Backup-Network',
            addresses: [
              { family: 'IPv4', value: '10.50.0.15/24', scope: 'private' },
              { family: 'IPv6', value: 'fe80::5054:ff:feaa:bbcc/64', scope: 'link-local' }
            ]
          },
          {
            name: 'lo',
            mac: 'MAC 없음',
            state: 'UP',
            cloudNic: null,
            network: '',
            addresses: [
              { family: 'IPv4', value: '127.0.0.1/8', scope: 'loopback' },
              { family: 'IPv6', value: '::1/128', scope: 'loopback' }
            ]
          }
        ];

        const routeColumns = [
          {
            title: 'Family',
            key: 'family',
            width: 82,
            customRender: ({ record }) => h(
              antd.Tag,
              { color: record.family === 'IPv6' ? 'purple' : 'green' },
              () => record.family
            )
          },
          {
            title: 'Destination',
            dataIndex: 'destination',
            key: 'destination',
            width: 170,
            customRender: ({ record }) => h('span', {}, [
              record.destination,
              record.default
                ? h('span', { class: 'default-route' }, 'DEFAULT')
                : null
            ])
          },
          { title: 'Gateway / Next hop', dataIndex: 'gateway', key: 'gateway', width: 165 },
          { title: 'Interface', dataIndex: 'interface', key: 'interface', width: 90 },
          { title: 'Metric', dataIndex: 'metric', key: 'metric', width: 70 },
          { title: 'Table', dataIndex: 'table', key: 'table', width: 70 },
          { title: 'Protocol', dataIndex: 'protocol', key: 'protocol', width: 85 }
        ];

        const routes = [
          { key: 'r1', family: 'IPv4', destination: '0.0.0.0/0', gateway: '192.168.10.1', interface: 'eth0', metric: 100, table: 'main', protocol: 'dhcp', default: true },
          { key: 'r2', family: 'IPv4', destination: '192.168.10.0/24', gateway: '—', interface: 'eth0', metric: 100, table: 'main', protocol: 'kernel' },
          { key: 'r3', family: 'IPv4', destination: '10.50.0.0/24', gateway: '—', interface: 'eth1', metric: 101, table: 'main', protocol: 'kernel' },
          { key: 'r4', family: 'IPv4', destination: '10.60.0.0/16', gateway: '10.50.0.1', interface: 'eth1', metric: 110, table: 'main', protocol: 'static' },
          { key: 'r5', family: 'IPv4', destination: '127.0.0.0/8', gateway: '—', interface: 'lo', metric: 0, table: 'local', protocol: 'kernel' },
          { key: 'r6', family: 'IPv6', destination: '::/0', gateway: 'fe80::1', interface: 'eth0', metric: 100, table: 'main', protocol: 'ra', default: true },
          { key: 'r7', family: 'IPv6', destination: '2001:db8::/64', gateway: '—', interface: 'eth0', metric: 256, table: 'main', protocol: 'kernel' },
          { key: 'r8', family: 'IPv6', destination: 'fe80::/64', gateway: '—', interface: 'eth1', metric: 256, table: 'main', protocol: 'kernel' }
        ];

        const filteredRoutes = computed(() => {
          if (routeFilter.value.startsWith('IPv4')) {
            return routes.filter(route => route.family === 'IPv4');
          }
          if (routeFilter.value.startsWith('IPv6')) {
            return routes.filter(route => route.family === 'IPv6');
          }
          if (routeFilter.value.startsWith('Default')) {
            return routes.filter(route => route.default);
          }
          return routes;
        });

        const healthColor = health => {
          if (health.startsWith('정상')) return 'success';
          if (health.startsWith('부분')) return 'warning';
          if (health.startsWith('오래됨')) return 'error';
          return 'default';
        };

        const setView = nextView => {
          view.value = nextView;
          const url = new URL(window.location.href);
          url.searchParams.set('view', nextView);
          window.history.replaceState({}, '', url);
          window.scrollTo(0, 0);
        };

        const openList = () => setView('list');
        const openDetail = () => setView('detail');

        return {
          detailTab,
          filteredRoutes,
          healthColor,
          interfaceColumns,
          interfaces,
          listColumns,
          openDetail,
          openList,
          routeColumns,
          routeFilter,
          routeFilters,
          view,
          vms
        };
      }
    }).use(antd).mount('#app');
  </script>
